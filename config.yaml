# Local Ollama model. Download it first:
# ollama pull llama3.2
model: "llama3.2"

# Used by the updated agent.py; harmless if using the original version.
ollama_url: "http://localhost:11434"

# Start with a seven-day window to confirm collection works.
# Change to 24 for a daily digest.
digest_hours: 168

# Maximum articles passed to the summarization model.
max_articles: 15

output_file: "digests/latest.md"

# Matching is case-insensitive against article titles and RSS excerpts.
# Any matching keyword includes the article.
# Higher weights increase its ranking.
topics:
  - name: "AI agents and automation"
    keywords:
      - "AI agent"
      - "AI agents"
      - "agentic"
      - "autonomous agent"
      - "multi-agent"
      - "multiagent"
      - "agent framework"
      - "tool calling"
      - "function calling"
      - "model context protocol"
      - "MCP"
      - "LangGraph"
      - "AutoGen"
      - "CrewAI"
    weight: 3

  - name: "LLMs and model releases"
    keywords:
      - "large language model"
      - "language model"
      - "LLM"
      - "foundation model"
      - "reasoning model"
      - "OpenAI"
      - "ChatGPT"
      - "GPT"
      - "Anthropic"
      - "Claude"
      - "Gemini"
      - "Llama"
      - "Mistral"
      - "DeepSeek"
      - "Qwen"
    weight: 3

  - name: "Local and open-source AI"
    keywords:
      - "open-source"
      - "open source"
      - "open-weight"
      - "open weight"
      - "local inference"
      - "on-device"
      - "Ollama"
      - "llama.cpp"
      - "GGUF"
      - "quantization"
      - "Hugging Face"
      - "small language model"
    weight: 3

  - name: "RAG and AI data platforms"
    keywords:
      - "retrieval-augmented"
      - "retrieval augmented"
      - "RAG"
      - "vector database"
      - "vector search"
      - "embedding"
      - "semantic search"
      - "knowledge graph"
      - "AI data platform"
      - "document retrieval"
    weight: 2

  - name: "AI engineering and evaluation"
    keywords:
      - "LLMOps"
      - "MLOps"
      - "evaluation"
      - "benchmark"
      - "observability"
      - "guardrail"
      - "prompt injection"
      - "fine-tuning"
      - "fine tuning"
      - "inference"
      - "distillation"
    weight: 2

  - name: "AI coding tools"
    keywords:
      - "coding assistant"
      - "coding agent"
      - "AI coding"
      - "code generation"
      - "GitHub Copilot"
      - "Cursor"
      - "Claude Code"
      - "Codex"
      - "software engineering"
